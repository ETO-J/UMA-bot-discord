# ============================================================
# Nginx configuration for bourbon-draw.cn
# FastAPI backend on 127.0.0.1:8000
# Shows maintenance page (down.html) when backend is offline
# ============================================================

# ---------- rate limiting ----------
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ---------- upstream backend ----------
upstream fastapi_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---------- HTTP → HTTPS redirect ----------
server {
    listen 80;
    server_name bourbon-draw.cn www.bourbon-draw.cn;

    # Uncomment below if you have SSL certs and want auto-redirect
    # return 301 https://$host$request_uri;

    # No SSL: serve directly
    include bourbon-draw.cn.shared.conf;
}

