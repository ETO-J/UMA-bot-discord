# ============================================================
# Shared location blocks for bourbon-draw.cn
# Included by both HTTP and HTTPS server blocks
# ============================================================

# ---------- common proxy settings ----------
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_connect_timeout 5s;
client_max_body_size 512m;

proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

proxy_intercept_errors on;

# ---------- custom error pages ----------
error_page 502 503 504 /down.html;

# ---------- static maintenance page ----------
location = /down.html {
    root C:/Users/Administrator/bpdiscord/webapp/static;
    internal;
}

# ---------- static assets (served directly by nginx) ----------
location /css/ {
    alias C:/Users/Administrator/bpdiscord/webapp/static/css/;
    expires 1d;
    add_header Cache-Control "public, immutable";
}
location /js/ {
    alias C:/Users/Administrator/bpdiscord/webapp/static/js/;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

# ---------- thumbnails (proxied with caching) ----------
location /thumbnails/ {
    proxy_pass http://fastapi_backend;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
}

# ---------- auth endpoints (rate limited) ----------
location /api/auth/ {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://fastapi_backend;
}

# ---------- API (rate limited) ----------
location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://fastapi_backend;
}

# ---------- everything else ----------
location / {
    proxy_pass http://fastapi_backend;
}
