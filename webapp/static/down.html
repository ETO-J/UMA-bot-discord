<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bourbon WebUI - 维护中</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  text-align: center;
  padding: 48px 36px;
  background: #16213e;
  border: 1px solid #2a2a4a;
  border-radius: 16px;
  max-width: 480px;
  margin: 20px;
}
.icon {
  font-size: 56px;
  margin-bottom: 20px;
}
h1 {
  font-size: 22px;
  font-weight: bold;
  color: #e94560;
  margin-bottom: 12px;
}
p {
  font-size: 14px;
  color: #a0a0b0;
  line-height: 1.7;
  margin-bottom: 8px;
}
.detail {
  font-size: 12px;
  color: #666;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #2a2a4a;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#x1f6a7;</div>
  <h1>&#x1f527; 服务器维护中</h1>
  <p>Bourbon WebUI 当前正在维护，</p>
  <p>我们正在进行服务器优化和升级工作。</p>
  <p>预计很快恢复，请稍后再试。</p>
  <div class="detail">
    <p>Server is under maintenance.</p>
    <p>We will be back shortly. Thank you for your patience.</p>
  </div>
</div>
</body>
</html>
