<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bourbon Webui</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <span class="logo" data-i18n="title">Bourbon WebUI</span>
  <div class="header-right">
    <span class="quota" id="quota-display">配额: --/--</span>
    <span class="online" id="online-display" style="display:none"></span>
    <span id="header-user"></span>
    <span style="font-size:14px;flex-shrink:0">🌐</span>
    <select id="sel-lang" class="sel-lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</header>

<div class="main-container">

  <aside class="panel panel-left" id="panel-left">
    <div class="section">
      <label class="label" data-i18n="workflow">工作流</label>
      <select id="sel-workflow">
        <option value="discord_anima_v2" data-i18n="workflowAnimaV2">Anima V2 (画师融合)</option>
        <option value="multidraw" data-i18n="workflowMultidraw">多角色合成 (Multidraw)</option>
      </select>
    </div>

    <div class="section">
      <label class="label" data-i18n="resolution">分辨率</label>
      <div class="res-grid">
        <button class="res-btn active" data-res="1">竖屏<br>832×1216</button>
        <button class="res-btn" data-res="2">方屏<br>1024×1024</button>
        <button class="res-btn" data-res="3">横屏<br>1216×832</button>
        <button class="res-btn" data-res="0" data-i18n="custom">自定义</button>
      </div>
      <div id="res-custom" class="res-custom" style="display:none">
        <input type="number" id="txt-custom-w" value="832" min="64" max="1920" data-i18n-placeholder="multidrawFields.w">
        <span class="res-x">×</span>
        <input type="number" id="txt-custom-h" value="1216" min="64" max="1920" data-i18n-placeholder="multidrawFields.h">
      </div>
    </div>

    <div id="fields-anima">
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="prompt">提示词</label>
          <button class="btn-expand" data-target="txt-prompt" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-prompt" rows="3" data-i18n-placeholder="promptPlaceholder" placeholder="输入提示词..."></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="artistChain">画师串</label>
          <button class="btn-expand" data-target="txt-artist-chain" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-artist-chain" rows="2" data-i18n-placeholder="artistPlaceholder" placeholder="artist1, artist2, ..."></textarea>
      </div>
    </div>

    <div id="fields-multidraw" style="display:none">
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="globalPrompt">全局提示词</label>
          <button class="btn-expand" data-target="txt-md-global" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-global" rows="2" data-i18n-placeholder="globalPlaceholder" placeholder="共享的背景/风格描述"></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="char1Prompt">角色 1 提示词</label>
          <button class="btn-expand" data-target="txt-md-p1" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-p1" rows="2" data-i18n-placeholder="char1Placeholder" placeholder="第一个角色的描述"></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="char2Prompt">角色 2 提示词</label>
          <button class="btn-expand" data-target="txt-md-p2" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-p2" rows="2" data-i18n-placeholder="char2Placeholder" placeholder="第二个角色的描述"></textarea>
      </div>
      <div class="section">
        <label class="label" data-i18n="area1">区域 1 (w h x y)</label>
        <div class="part-row">
          <input type="number" id="txt-part1-w" value="832" data-i18n-placeholder="multidrawFields.w">
          <input type="number" id="txt-part1-h" value="608" data-i18n-placeholder="multidrawFields.h">
          <input type="number" id="txt-part1-x" value="0" data-i18n-placeholder="multidrawFields.x">
          <input type="number" id="txt-part1-y" value="0" data-i18n-placeholder="multidrawFields.y">
        </div>
      </div>
      <div class="section">
        <label class="label" data-i18n="area2">区域 2 (w h x y)</label>
        <div class="part-row">
          <input type="number" id="txt-part2-w" value="832" data-i18n-placeholder="multidrawFields.w">
          <input type="number" id="txt-part2-h" value="608" data-i18n-placeholder="multidrawFields.h">
          <input type="number" id="txt-part2-x" value="832" data-i18n-placeholder="multidrawFields.x">
          <input type="number" id="txt-part2-y" value="0" data-i18n-placeholder="multidrawFields.y">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="label-row">
        <label class="label" data-i18n="negativePrompt">负面提示词</label>
        <button class="btn-expand" data-target="txt-negative" data-i18n-title="expandTitle">⤡</button>
      </div>
      <textarea id="txt-negative" rows="2" data-i18n-placeholder="negativePlaceholder" placeholder="输入负面提示词..."></textarea>
    </div>

    <div class="section">
      <button class="adv-toggle" id="btn-adv-toggle" data-i18n="advToggleClosed">高级参数 ▸</button>
    </div>
    <div class="adv-panel" id="adv-panel" style="display:none">
      <div class="section">
        <label class="label" data-i18n="seed">种子</label>
        <input type="number" id="txt-seed" value="-1" min="-1">
      </div>
      <div class="section">
        <label class="label" data-i18n="sampler">采样器</label>
        <select id="sel-sampler">
          <option value="" data-i18n="samplerDefault">使用工作流默认</option>
          <option value="euler">euler</option>
          <option value="euler_ancestral">euler_ancestral</option>
          <option value="dpmpp_2m">dpmpp_2m</option>
          <option value="dpmpp_2m_sde">dpmpp_2m_sde</option>
          <option value="dpmpp_3m_sde">dpmpp_3m_sde</option>
          <option value="dpmpp_sde">dpmpp_sde</option>
          <option value="dpm_2">dpm_2</option>
          <option value="dpm_2_ancestral">dpm_2_ancestral</option>
          <option value="lcm">lcm</option>
          <option value="heun">heun</option>
          <option value="heunpp2">heunpp2</option>
          <option value="ddim">ddim</option>
        </select>
      </div>
      <div class="section">
        <label class="label" data-i18n="scheduler">调度器</label>
        <select id="sel-scheduler">
          <option value="" data-i18n="schedulerDefault">使用工作流默认</option>
          <option value="normal">normal</option>
          <option value="karras">karras</option>
          <option value="exponential">exponential</option>
          <option value="sgm_uniform">sgm_uniform</option>
          <option value="simple">simple</option>
          <option value="ddim_uniform">ddim_uniform</option>
          <option value="beta">beta</option>
        </select>
      </div>
      <div class="section">
        <label class="label" data-i18n="steps">步数</label>
        <input type="number" id="txt-steps" value="" min="1" max="100" data-i18n-placeholder="stepsPlaceholder" placeholder="使用工作流默认">
      </div>
      <div class="section">
        <label class="label" data-i18n="cfg">CFG</label>
        <input type="number" id="txt-cfg" value="" min="1" max="30" step="0.5" data-i18n-placeholder="cfgPlaceholder" placeholder="使用工作流默认">
      </div>
      <div class="section">
        <button id="btn-open-lora" class="adv-toggle" data-i18n="loraManage">管理 LoRA ▸</button>
      </div>
    </div>

    <button id="btn-generate" class="btn-primary btn-large" data-i18n="generate">生成</button>
  </aside>

  <main class="panel panel-center">
    <div id="preview-area">
      <div id="preview-placeholder" data-i18n="waiting">等待生成...</div>
      <img id="preview-img" src="" alt="" style="display:none">
      <div id="preview-spinner" class="spinner" style="display:none"></div>
      <div id="preview-status" class="status-text"></div>
    </div>
  </main>

  <aside class="panel panel-right" id="panel-right">
    <div class="section" style="margin-bottom:8px">
      <div class="label-row">
        <label class="label" data-i18n="history">生成历史</label>
        <div>
          <button id="btn-expand-panel" class="btn-expand" data-i18n-title="expandTitle" title="放大/还原">⤡</button>
          <button id="btn-refresh-history" class="btn-small" style="margin-left:4px" data-i18n="historyRefresh">刷新</button>
        </div>
      </div>
    </div>
    <div id="task-list"></div>
  </aside>
</div>

<div id="lora-modal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" data-i18n="loraTitle">LoRA 管理器</span>
      <button id="btn-close-lora" class="modal-close">&times;</button>
    </div>
    <div class="lora-toolbar">
      <span class="hint" data-i18n="loraDefaultWeight">默认权重:</span>
      <input type="number" id="txt-lora-defweight" value="0.80" min="0" max="2" step="0.05" style="width:60px">
      <button id="btn-lora-reset" class="btn-danger" style="width:auto;margin:0;padding:5px 10px;font-size:11px" data-i18n="loraRemoveAll">全部移除</button>
      <button id="btn-lora-refresh" class="btn-small" style="margin:0" data-i18n="loraRefresh">刷新列表</button>
    </div>
    <div id="lora-gallery" class="lora-gallery">加载中...</div>
  </div>
</div>

    <script src="/js/i18n.js?v=9"></script>
    <script src="/js/api.js?v=9"></script>
    <script src="/js/app.js?v=9"></script>
</body>
</html>
