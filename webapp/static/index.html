<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bourbon Webui</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=42">
</head>
<body>

<header>
  <span class="logo" data-i18n="title">Bourbon WebUI</span>
  <div class="header-right">
    <span class="quota" id="quota-display">配额: --/--</span>
    <span class="online" id="online-display" style="display:none"></span>
    <span id="header-user"></span>
    <span style="font-size:14px;flex-shrink:0">🌐</span>
    <select id="sel-lang" class="sel-lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</header>

<div class="main-container">

  <aside class="panel panel-left" id="panel-left">
    <div class="section">
      <label class="label" data-i18n="workflow">工作流</label>
      <select id="sel-workflow">
        <option value="discord_anima_fast" data-i18n="workflowAnimaFast">Anima Fast (加速·默认)</option>
        <option value="discord_差分" data-i18n="workflowDiff">Anima 差分 (图生图)</option>
        <option value="multidraw" data-i18n="workflowMultidraw">多角色合成 (Multidraw)</option>
        <option value="webui_video" data-i18n="workflowVideo">视频生成 (MiniMax H3)</option>
        <option value="discord_flux2_9b_edit" data-i18n="workflowFlux2Edit">Flux2 图像编辑 (Klein 9B)</option>
      </select>
    </div>

    <div class="section" id="section-resolution">
      <label class="label" data-i18n="resolution">分辨率</label>
      <div class="res-grid">
        <button class="res-btn active" data-res="1">竖屏<br>832×1216</button>
        <button class="res-btn" data-res="2">方屏<br>1024×1024</button>
        <button class="res-btn" data-res="3">横屏<br>1216×832</button>
        <button class="res-btn" data-res="0" data-i18n="custom">自定义</button>
      </div>
      <div id="res-custom" class="res-custom" style="display:none">
        <input type="number" id="txt-custom-w" value="832" min="64" max="1920" data-i18n-placeholder="multidrawFields.w">
        <span class="res-x">×</span>
        <input type="number" id="txt-custom-h" value="1216" min="64" max="1920" data-i18n-placeholder="multidrawFields.h">
      </div>
    </div>

    <div id="fields-anima">
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="prompt">提示词</label>
          <button class="btn-expand" data-target="txt-prompt" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-prompt" rows="3" data-i18n-placeholder="promptPlaceholder" placeholder="输入提示词..."></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="artistChain">画师串</label>
          <button class="btn-expand" data-target="txt-artist-chain" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-artist-chain" rows="2" data-i18n-placeholder="artistPlaceholder" placeholder="artist1, artist2, ..."></textarea>
      </div>
      <div class="section">
        <label class="label">
          <input type="checkbox" id="chk-hd-mode">
          <span data-i18n="hdMode">高清增强</span>
        </label>
        <div style="font-size:11px;color:var(--fg2);margin-top:2px" data-i18n="hdModeHint">消耗10 配额，放大精炼生成更高质量图像</div>
      </div>
    </div>

    <div id="fields-diff-image" style="display:none">
      <div class="section">
        <label class="label" data-i18n="diffSourceImage">底图（必须）</label>
        <div class="video-drop-zone" id="diff-source-drop">
          <input type="file" id="diff-source-input" accept="image/*" hidden>
          <img id="diff-source-preview" class="video-preview-img" style="display:none">
          <span id="diff-source-placeholder" class="video-drop-text" data-i18n="diffSourceDropHint">点击或拖拽上传底图</span>
        </div>
      </div>
    </div>

    <div id="fields-multidraw" style="display:none">
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="globalPrompt">全局提示词</label>
          <button class="btn-expand" data-target="txt-md-global" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-global" rows="2" data-i18n-placeholder="globalPlaceholder" placeholder="共享的背景风格描述"></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="char1Prompt">角色 1 提示词</label>
          <button class="btn-expand" data-target="txt-md-p1" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-p1" rows="2" data-i18n-placeholder="char1Placeholder" placeholder="第一个角色的描述"></textarea>
      </div>
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="char2Prompt">角色 2 提示词</label>
          <button class="btn-expand" data-target="txt-md-p2" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-md-p2" rows="2" data-i18n-placeholder="char2Placeholder" placeholder="第二个角色的描述"></textarea>
      </div>
      <div class="section">
        <label class="label" data-i18n="area1">区域 1 (w h x y)</label>
        <div class="part-row">
          <input type="number" id="txt-part1-w" value="832" data-i18n-placeholder="multidrawFields.w">
          <input type="number" id="txt-part1-h" value="608" data-i18n-placeholder="multidrawFields.h">
          <input type="number" id="txt-part1-x" value="0" data-i18n-placeholder="multidrawFields.x">
          <input type="number" id="txt-part1-y" value="0" data-i18n-placeholder="multidrawFields.y">
        </div>
      </div>
      <div class="section">
        <label class="label" data-i18n="area2">区域 2 (w h x y)</label>
        <div class="part-row">
          <input type="number" id="txt-part2-w" value="832" data-i18n-placeholder="multidrawFields.w">
          <input type="number" id="txt-part2-h" value="608" data-i18n-placeholder="multidrawFields.h">
          <input type="number" id="txt-part2-x" value="832" data-i18n-placeholder="multidrawFields.x">
          <input type="number" id="txt-part2-y" value="0" data-i18n-placeholder="multidrawFields.y">
        </div>
      </div>
    </div>

    <div id="fields-video" style="display:none">
      <div class="section">
        <div class="label-row">
          <label class="label" data-i18n="prompt">提示词</label>
          <button class="btn-expand" data-target="txt-video-prompt" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-video-prompt" rows="3" data-i18n-placeholder="promptPlaceholder" placeholder="输入提示词..."></textarea>
      </div>
      <div class="section">
        <label class="label" data-i18n="videoMode">视频模式</label>
        <select id="sel-video-mode">
          <option value="fl2va" data-i18n="videoModeFl2va">首尾帧 (FL2VA)</option>
          <option value="ref2va" data-i18n="videoModeRef2va">参考生视频 (Ref2VA)</option>
        </select>
      </div>
      <div id="video-fl2va-fields">
        <div class="section">
          <label class="label" data-i18n="videoFirstFrame">首帧图像</label>
          <div class="video-drop-zone" id="video-first-drop">
            <input type="file" id="video-first-input" accept="image/*" hidden>
            <img id="video-first-preview" class="video-preview-img" style="display:none">
            <span id="video-first-placeholder" class="video-drop-text" data-i18n="videoDropHint">点击或拖拽上传首帧</span>
          </div>
        </div>
        <div class="section">
          <label class="label" data-i18n="videoLastFrame">尾帧图像（可选）</label>
          <div class="video-drop-zone" id="video-last-drop">
            <input type="file" id="video-last-input" accept="image/*" hidden>
            <img id="video-last-preview" class="video-preview-img" style="display:none">
            <span id="video-last-placeholder" class="video-drop-text" data-i18n="videoDropHintOptional">点击或拖拽上传尾帧（可选）</span>
          </div>
        </div>
      </div>
      <div id="video-ref2va-fields" style="display:none">
        <div class="section">
          <label class="label" data-i18n="videoAspectRatio">宽高比</label>
          <select id="sel-video-ratio">
            <option value="1:1">1:1 (Square)</option>
            <option value="2:3">2:3 (Portrait Photo)</option>
            <option value="3:2">3:2 (Photo)</option>
            <option value="4:3">4:3 (Standard)</option>
            <option value="3:4">3:4 (Portrait Standard)</option>
            <option value="16:9" selected>16:9 (Widescreen)</option>
            <option value="9:16">9:16 (Portrait Widescreen)</option>
          </select>
        </div>
        <div class="section">
          <label class="label" data-i18n="refImagesLabel">参考图 (1-6)</label>
          <div class="ref-image-grid">
            <div class="video-drop-zone ref-slot" id="ref-image-slot-0"></div>
            <div class="video-drop-zone ref-slot" id="ref-image-slot-1"></div>
            <div class="video-drop-zone ref-slot" id="ref-image-slot-2"></div>
            <div class="video-drop-zone ref-slot" id="ref-image-slot-3"></div>
            <div class="video-drop-zone ref-slot" id="ref-image-slot-4"></div>
            <div class="video-drop-zone ref-slot" id="ref-image-slot-5"></div>
          </div>
        </div>
      </div>
      <div class="section">
        <label class="label" data-i18n="videoQuality">画质</label>
        <div class="res-grid">
          <button class="quality-btn active" data-quality="480p">480p</button>
          <button class="quality-btn" data-quality="720p">720p</button>
        </div>
      </div>
      <div class="section">
        <label class="label" data-i18n="videoDuration">时长</label>
        <select id="sel-video-duration">
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="3">3s</option>
          <option value="4">4s</option>
          <option value="5" selected>5s</option>
          <option value="6">6s</option>
          <option value="7">7s</option>
          <option value="8">8s</option>
          <option value="9">9s</option>
          <option value="10">10s</option>
          <option value="11">11s</option>
          <option value="12">12s</option>
          <option value="13">13s</option>
          <option value="14">14s</option>
          <option value="15">15s</option>
        </select>
      </div>
      <div class="section">
        <span class="label" id="video-cost-display" style="color:var(--yellow);font-size:13px"></span>
      </div>
    </div>

    <div id="fields-flux2" style="display:none">
      <div class="section" id="flux2-mode-section">
        <label class="label" data-i18n="flux2Mode">处理模式</label>
        <div class="flux2-mode-group">
          <button class="flux2-mode-btn active" data-mode="edit" data-i18n="flux2ModeEdit">Flux2 编辑</button>
          <button class="flux2-mode-btn" data-mode="edit_cutout" data-i18n="flux2ModeEditCutout">编辑+抠图</button>
          <button class="flux2-mode-btn" data-mode="cutout" data-i18n="flux2ModeCutout">直接抠图</button>
        </div>
      </div>
      <div class="section" id="flux2-prompt-section">
        <div class="label-row">
          <label class="label" data-i18n="prompt">提示词</label>
          <button class="btn-expand" data-target="txt-flux2-prompt" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-flux2-prompt" rows="3" data-i18n-placeholder="flux2PromptPlaceholder" placeholder="描述编辑目标..."></textarea>
      </div>
      <div class="section">
        <label class="label" data-i18n="flux2SourceImage">原图（必须）</label>
        <div class="video-drop-zone" id="flux2-source-drop">
          <input type="file" id="flux2-source-input" accept="image/*" hidden>
          <img id="flux2-source-preview" class="video-preview-img" style="display:none">
          <span id="flux2-source-placeholder" class="video-drop-text" data-i18n="flux2SourceDropHint">点击或拖拽上传原图</span>
        </div>
      </div>
      <div class="section" id="flux2-ref-section">
        <label class="label" data-i18n="flux2RefImage">参考图（可选）</label>
        <div class="video-drop-zone" id="flux2-ref-drop">
          <input type="file" id="flux2-ref-input" accept="image/*" hidden>
          <img id="flux2-ref-preview" class="video-preview-img" style="display:none">
          <span id="flux2-ref-placeholder" class="video-drop-text" data-i18n="flux2RefDropHint">点击或拖拽上传参考图（可选）</span>
        </div>
      </div>
      <div class="section" id="flux2-negative-section">
        <div class="label-row">
          <label class="label" data-i18n="negativePrompt">负面提示词</label>
          <button class="btn-expand" data-target="txt-flux2-negative" data-i18n-title="expandTitle">⤡</button>
        </div>
        <textarea id="txt-flux2-negative" rows="2" data-i18n-placeholder="videoNegPlaceholder" placeholder="留空使用默认"></textarea>
      </div>
    </div>

    <div class="section" id="section-negative">
      <div class="label-row">
        <label class="label" data-i18n="negativePrompt">负面提示词</label>
        <button class="btn-expand" data-target="txt-negative" data-i18n-title="expandTitle">⤡</button>
      </div>
      <textarea id="txt-negative" rows="2" data-i18n-placeholder="negativePlaceholder" placeholder="输入负面提示词..."></textarea>
    </div>

    <div class="section">
      <button class="adv-toggle" id="btn-open-assets" data-i18n="assetLibrary">素材库</button>
    </div>

    <div class="section">
      <button class="adv-toggle" id="btn-adv-toggle" data-i18n="advToggleClosed">高级参数 ▸</button>
    </div>
    <div class="adv-panel" id="adv-panel" style="display:none">
      <div class="section">
        <label class="label" data-i18n="seed">种子</label>
        <input type="number" id="txt-seed" value="-1" min="-1">
      </div>
      <div class="section adv-ref-only">
        <label class="label" data-i18n="refVideoLabel">参考视频 (1-2)</label>
        <div class="video-drop-zone ref-file-slot" id="ref-video-slot-0"></div>
        <div class="video-drop-zone ref-file-slot" id="ref-video-slot-1"></div>
      </div>
      <div class="section adv-ref-only">
        <label class="label" data-i18n="refAudioLabel">参考音频 (1-3)</label>
        <div class="video-drop-zone ref-file-slot" id="ref-audio-slot-0"></div>
        <div class="video-drop-zone ref-file-slot" id="ref-audio-slot-1"></div>
        <div class="video-drop-zone ref-file-slot" id="ref-audio-slot-2"></div>
      </div>
      <div class="section adv-ref-only">
        <label>
          <input type="checkbox" id="chk-output-last-frame">
          <span data-i18n="outputLastFrame">输出尾帧</span>
        </label>
      </div>
      <div class="section adv-ref-only">
        <label>
          <input type="checkbox" id="chk-store-ref-assets" checked>
          <span data-i18n="storeRefAssets">上传参考素材到素材库</span>
        </label>
      </div>
      <div class="section adv-video-lora-only">
        <button id="btn-open-video-lora" class="adv-toggle" data-i18n="videoLoraManage">视频 LoRA ▸</button>
      </div>
      <div class="section adv-image-only">
        <label class="label" data-i18n="sampler">采样器</label>
        <select id="sel-sampler">
          <option value="" data-i18n="samplerDefault">使用工作流默认</option>
          <option value="euler">euler</option>
          <option value="euler_ancestral">euler_ancestral</option>
          <option value="dpmpp_2m">dpmpp_2m</option>
          <option value="dpmpp_2m_sde">dpmpp_2m_sde</option>
          <option value="dpmpp_3m_sde">dpmpp_3m_sde</option>
          <option value="dpmpp_sde">dpmpp_sde</option>
          <option value="dpm_2">dpm_2</option>
          <option value="dpm_2_ancestral">dpm_2_ancestral</option>
          <option value="lcm">lcm</option>
          <option value="heun">heun</option>
          <option value="heunpp2">heunpp2</option>
          <option value="ddim">ddim</option>
        </select>
      </div>
      <div class="section adv-image-only">
        <label class="label" data-i18n="scheduler">调度器</label>
        <select id="sel-scheduler">
          <option value="" data-i18n="schedulerDefault">使用工作流默认</option>
          <option value="normal">normal</option>
          <option value="karras">karras</option>
          <option value="exponential">exponential</option>
          <option value="sgm_uniform">sgm_uniform</option>
          <option value="simple">simple</option>
          <option value="ddim_uniform">ddim_uniform</option>
          <option value="beta">beta</option>
        </select>
      </div>
      <div class="section adv-diff-only">
        <label class="label" data-i18n="diffStrength">差分强度</label>
        <div class="denoise-row">
          <input type="range" id="rng-diff-strength" min="0" max="1" step="0.05" value="0.7">
          <span class="diff-strength-val" id="diff-strength-val">0.70</span>
        </div>
        <div class="hint" data-i18n="diffStrengthHint">数值越大，图像与原图差异越大</div>
      </div>
      <div class="section adv-image-only" id="section-lora-btn">
        <button id="btn-open-lora" class="adv-toggle" data-i18n="loraManage">管理 LoRA ▸</button>
      </div>
    </div>

    <div class="section" id="draw-cost-section" style="margin-bottom:4px">
      <span class="label" id="draw-cost-display" style="color:var(--yellow);font-size:13px"></span>
    </div>
    <button id="btn-generate" class="btn-primary btn-large" data-i18n="generate">生成</button>
  </aside>

  <main class="panel panel-center">
    <div id="preview-area">
      <div id="preview-placeholder" data-i18n="waiting">等待生成...</div>
      <img id="preview-img" src="" alt="" style="display:none">
      <video id="preview-video" src="" controls style="display:none;max-width:100%;max-height:100%"></video>
      <div id="preview-last-frame-wrap" style="display:none">
        <div class="label" data-i18n="lastFramePreview">输出尾帧</div>
        <img id="preview-last-frame" src="" alt="" style="display:none;max-width:100%;max-height:260px;border-radius:8px">
      </div>
      <div id="preview-spinner" class="spinner" style="display:none"></div>
      <div id="preview-status" class="status-text"></div>
    </div>
  </main>

  <aside class="panel panel-right" id="panel-right">
    <div class="section" style="margin-bottom:8px">
      <div class="label-row">
        <label class="label" data-i18n="history">生成历史</label>
        <button id="btn-refresh-history" class="btn-small" data-i18n="historyRefresh">刷新</button>
      </div>
    </div>
    <div id="task-list"></div>
  </aside>
</div>

<div id="lora-modal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" data-i18n="loraTitle">LoRA 管理器</span>
      <button id="btn-close-lora" class="modal-close">&times;</button>
    </div>
    <div class="lora-toolbar">
      <span class="hint" data-i18n="loraDefaultWeight">默认权重:</span>
      <input type="number" id="txt-lora-defweight" value="0.80" min="0" max="2" step="0.05" style="width:60px">
      <button id="btn-lora-reset" class="btn-danger" style="width:auto;margin:0;padding:5px 10px;font-size:11px" data-i18n="loraRemoveAll">全部移除</button>
      <button id="btn-lora-refresh" class="btn-small" style="margin:0" data-i18n="loraRefresh">刷新列表</button>
    </div>
    <div id="lora-gallery" class="lora-gallery">加载中...</div>
  </div>
</div>

<div id="asset-modal" class="modal-overlay" style="display:none">
  <div class="modal-content asset-modal-content">
    <div class="modal-header">
      <span class="modal-title" data-i18n="assetLibrary">素材库</span>
      <button id="btn-close-assets" class="modal-close">&times;</button>
    </div>
    <div class="asset-toolbar">
      <input type="file" id="asset-file" accept="image/*,video/*,audio/*" multiple hidden>
      <div class="asset-tab-group">
        <button id="btn-asset-my" class="asset-tab active" data-i18n="assetMy">我的素材</button>
        <button id="btn-asset-public" class="asset-tab" data-i18n="assetPublic">公共素材库</button>
      </div>
      <span class="asset-toolbar-sep"></span>
      <div class="asset-act-group">
        <button id="btn-asset-upload" class="asset-btn asset-btn-upload" data-i18n="assetUpload">上传</button>
        <button id="btn-asset-folder" class="asset-btn" data-i18n="assetFolderCreate">新建文件夹</button>
        <button id="btn-asset-refresh" class="asset-btn" data-i18n="assetRefresh">刷新</button>
        <button id="btn-asset-multiselect" class="asset-btn" data-i18n="assetMultiSelect">多选</button>
        <button id="btn-asset-use" class="asset-btn asset-btn-main" disabled data-i18n="assetUse">使用</button>
        <button id="btn-asset-publish" class="asset-btn" disabled data-i18n="assetPublish">发布</button>
        <button id="btn-asset-save" class="asset-btn asset-btn-main" style="display:none" disabled data-i18n="assetSave">保存</button>
        <button id="btn-asset-clear" class="asset-btn" style="display:none" data-i18n="assetClearSelection">取消选择</button>
        <input type="file" id="asset-public-file" accept="image/*,video/*,audio/*" multiple hidden>
        <button id="btn-asset-pub-upload" class="asset-btn asset-btn-upload" style="display:none" data-i18n="assetPublicUpload">上传公共素材</button>
        <button id="btn-asset-pub-edit" class="asset-btn" style="display:none" disabled data-i18n="assetPublicEdit">编辑</button>
        <button id="btn-asset-pub-remove" class="asset-btn asset-btn-danger" style="display:none" disabled data-i18n="assetPublicRemove">下架</button>
        <button id="btn-asset-delete" class="asset-btn asset-btn-danger" disabled data-i18n="assetDelete">删除</button>
      </div>
      <span id="asset-quota-display" class="asset-quota-hint"></span>
    </div>
    <div id="asset-upload-progress" class="asset-upload-progress" style="display:none">
      <div class="asset-upload-track"><div id="asset-upload-bar" class="asset-upload-bar"></div></div>
      <span id="asset-upload-status" class="hint"></span>
    </div>
    <div class="asset-explorer">
      <div class="asset-tree-panel">
        <div class="asset-tree-title" data-i18n="assetFolders">文件夹</div>
        <div id="asset-tree" class="asset-tree"></div>
      </div>
      <div class="asset-main-panel">
        <div class="asset-breadcrumb" id="asset-breadcrumb"></div>
        <div id="asset-grid" class="asset-file-grid"></div>
      </div>
    </div>
  </div>
</div>

<!-- AI Drawing Assistant Chat Bubble -->
<div id="chat-bubble" class="chat-bubble" data-i18n-title="chatBubbleTitle" title="AI 绘画助手">
  <img src="/images/chat-icon.png" class="chat-bubble-img" alt="AI" onerror="this.style.display='none';document.getElementById('chat-bubble-svg').style.display='block'">
  <svg id="chat-bubble-svg" class="chat-bubble-icon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span class="chat-bubble-label" data-i18n="chatBubbleLabel">AI助手</span>
</div>

<!-- AI Drawing Assistant Chat Panel -->
<div id="chat-panel" class="chat-panel" style="display:none">
  <div class="chat-header">
    <span class="chat-header-title" data-i18n="chatTitle">AI 绘画助手</span>
    <button id="chat-minimize" class="chat-close">&minus;</button>
  </div>
  <div id="chat-messages" class="chat-messages">
    <div class="chat-welcome" data-i18n="chatWelcome">你好！我是绘画助手，可以帮你将想法转化为精准的英文绘图提示词。试着告诉我你想画什么吧~</div>
  </div>
  <div id="chat-image-preview" class="chat-image-preview" style="display:none"></div>
  <div id="chat-estimate" class="chat-estimate" data-i18n="chatEstimatedCost"></div>
  <div class="chat-input-row">
    <textarea id="chat-input" rows="1" data-i18n-placeholder="chatPlaceholder" placeholder="描述你的绘图想法..."></textarea>
    <button id="chat-image-btn" class="chat-image-btn" data-i18n-title="chatUploadHint" title="上传图片">&#128247;</button>
    <button id="chat-send" class="chat-send-btn" data-i18n="chatSend">发送</button>
  </div>
  <input type="file" id="chat-file" accept="image/*" multiple style="display:none">
  <div class="chat-footer">
    <button id="chat-clear" class="chat-clear-btn" data-i18n="chatClear">清除对话</button>
  </div>
</div>

    <script src="/js/api.js?v=42"></script>
    <script src="/js/chat.js?v=42"></script>
    <script src="/js/app.js?v=42"></script>
</body>
